<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Stats de AlanDCE</title>
  <desc id="desc">16 repositorios públicos, 2 seguidores y 10 usuarios seguidos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#120a1c"/>
      <stop offset="1" stop-color="#0b0612"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="180" rx="24" fill="url(#bg)" stroke="#a855f7" stroke-opacity=".35"/>
  <text x="32" y="42" fill="#a855f7" font-family="Arial,sans-serif" font-size="20" font-weight="700">AlanDCE</text>
  <text x="32" y="66" fill="#9ca3af" font-family="Arial,sans-serif" font-size="13">GitHub Stats</text>
  <path d="M32 82h656" stroke="#a855f7" stroke-opacity=".2"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(145 120)">
      <text fill="#f3f4f6" font-size="25" font-weight="700">16</text>
      <text y="25" fill="#9ca3af" font-size="12">Repositorios</text>
    </g>
    <g transform="translate(360 120)">
      <text fill="#f3f4f6" font-size="25" font-weight="700">2</text>
      <text y="25" fill="#9ca3af" font-size="12">Seguidores</text>
    </g>
    <g transform="translate(575 120)">
      <text fill="#f3f4f6" font-size="25" font-weight="700">10</text>
      <text y="25" fill="#9ca3af" font-size="12">Siguiendo</text>
    </g>
  </g>
  <circle cx="676" cy="28" r="5" fill="#a855f7" filter="url(#glow)"/>
</svg>
